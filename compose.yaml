services:
  db:
    image: postgres:15-alpine
    container_name: prog4-puljiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: proy_db
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d proy_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
